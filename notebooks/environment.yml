# Optional conda environment for the software examples under notebooks/.
# TCRen, ARDA and notebook/viz dependencies come from the editable install and
# their constraints in pyproject.toml. Scientific reproduction records are archived
# in the benchmark repository; see README.md.
#
#   bash setup.sh        # creates the env, editable-installs tcren[notebooks,viz], registers a kernel
#
name: tcren-nb
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - mmseqs2          # annotation backend binary (used by arda + MHC mapping)
  - cxx-compiler     # builds arda's C++ extension on install
  - cmake>=3.18
  - pip
  - pip:
      - scikit-build-core>=0.10
      - pybind11>=2.12,<4
      # tcren (+ arda-mapper + notebook analysis deps) is editable-installed by setup.sh:
      #   pip install -e ..[notebooks,viz]
