name: tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Build tooling for the C++ extension
        # tcren ships pybind11 extensions (src/_align, _geom, …), built by scikit-build-core;
        # cmake + ninja + a C++ compiler are required (gcc is on the runner).
        run: uv pip install --system cmake ninja
      - name: Install package without arda (lean unit suite)
        # arda (PyPI: arda-mapper) is a real runtime dependency, but the non-slow suite imports it
        # lazily (importorskip) and CI has no arda reference database — so install tcren --no-deps
        # and add the runtime deps explicitly, minus arda. The C++ ext is still built and tested.
        # rapidfuzz is a pure-wheel dep (no external binary, unlike arda) needed by the redundancy
        # clustering tests, so it is included here.
        run: |
          uv pip install --system -e . --no-deps
          uv pip install --system biopython scipy numpy polars typer requests huggingface_hub rapidfuzz \
                      pytest pytest-cov matplotlib
      - name: Run unit tests (arda/mmseqs-backed tests skip without arda)
        # Coverage gate: the lean unit suite covers ~58% of src/tcren; fail below 50%
        # to catch large drops without flaking on which optional (C++/arda) tests run.
        run: pytest -m "not slow" -ra --cov=tcren --cov-report=term-missing --cov-fail-under=50
