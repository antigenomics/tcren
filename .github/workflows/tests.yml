name: tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Create venv + build tooling for the C++ extension
        # A repo-local uv venv (the CI runner's Python is externally managed, so --system is refused);
        # subsequent `uv pip install` auto-targets .venv. tcren ships pybind11 extensions (src/_align,
        # _geom, …) built by scikit-build-core, so cmake + ninja + a C++ compiler are required.
        run: uv venv --python ${{ matrix.python-version }} && uv pip install cmake ninja
      - name: Install package without arda (lean unit suite)
        # arda (PyPI: arda-mapper) is a real runtime dependency, but the non-slow suite imports it
        # lazily (importorskip) and CI has no arda reference database — so install tcren --no-deps
        # and add the runtime deps explicitly, minus arda. The C++ ext is still built and tested.
        # rapidfuzz is a pure-wheel dep (no external binary, unlike arda) needed by the redundancy
        # clustering tests, so it is included here.
        run: |
          uv pip install -e . --no-deps
          uv pip install biopython scipy numpy polars typer requests huggingface_hub rapidfuzz \
                      scikit-learn \
                      pytest pytest-cov matplotlib
      - name: Run unit tests (arda/mmseqs-backed tests skip without arda)
        # Coverage gate: the lean unit suite covers ~58% of src/tcren; fail below 50%
        # to catch large drops without flaking on which optional (C++/arda) tests run.
        run: .venv/bin/pytest -m "not slow" -ra --cov=tcren --cov-report=term-missing --cov-fail-under=50

  lint:
    # Nothing enforced ruff before, so the tree had drifted to 77 reports. The settings it runs
    # under live in pyproject.toml [tool.ruff.lint], where the two rules this codebase declines
    # (E702, E402) are ignored with their reasons -- so a report here is always worth acting on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: ruff
        # Pinned to the same series as the `dev` extra in pyproject.toml. A bare `uvx ruff` takes
        # whatever is newest, whose default rule set is wider -- the first run of this job found
        # 167 reports against 0 locally, none of them a regression.
        run: uvx ruff@0.15.22 check src tests
