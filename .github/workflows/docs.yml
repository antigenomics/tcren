name: docs

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref so a dev push never cancels an in-flight master Pages deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install pandoc
        # nbsphinx converts the tutorial notebooks via pandoc (fails with PandocMissing otherwise).
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install docs toolchain
        # A repo-local uv venv (the runner's Python is externally managed). autodoc imports tcren from
        # src/ with heavy deps mocked (docs/conf.py:autodoc_mock_imports), so arda / the native
        # toolchain are not needed. ipython provides the ``ipython3`` Pygments lexer the notebooks use.
        run: uv venv --python 3.12 && uv pip install sphinx pydata-sphinx-theme nbsphinx ipython polars numpy typer requests
      - name: Build HTML (fail on warnings)
        run: .venv/bin/sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # The github-pages environment only allows deploys from the default branch; on dev we
    # validate the build (above) but skip deployment so the workflow stays green.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
