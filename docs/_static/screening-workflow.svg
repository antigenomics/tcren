<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc">
<title id="title">Task-matched TCRen screening workflow</title><desc id="desc">Annotated complexes form either a fixed-receptor peptide cohort or a fixed-pMHC receptor cohort. The varying side receives the structural alanine reference. Components are reported separately, models with no interface are discarded, and cohorts with at least 30 scorable models also receive a frozen combination.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536373"/></marker></defs>
<rect width="900" height="570" rx="16" fill="#f6f8fa"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#203044">
<rect x="180" y="20" width="540" height="66" rx="10" fill="#e4edf5" stroke="#53799a"/><text x="450" y="46" font-size="19" font-weight="bold">Annotated αβ TCR:peptide–MHC models</text><text x="450" y="69" font-size="15">One cohort · optional generator ipTM</text>
<g fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"><path d="M450 86V110H235V134"/><path d="M450 110H665V134"/></g>
<rect x="40" y="138" width="390" height="109" rx="10" fill="#fff" stroke="#53799a"/><text x="235" y="166" font-size="19" font-weight="bold">Peptide ranking</text><text x="235" y="191" font-size="16">Fixed receptor · peptides vary</text><text x="235" y="222" font-size="16">Structural Ala reference on the epitope</text>
<rect x="470" y="138" width="390" height="109" rx="10" fill="#fff" stroke="#438a7a"/><text x="665" y="166" font-size="19" font-weight="bold">Receptor ranking</text><text x="665" y="191" font-size="16">Fixed pMHC · receptors vary</text><text x="665" y="222" font-size="16">Structural Ala reference on contacted CDRs</text>
<g fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"><path d="M235 247V270H450V292"/><path d="M665 247V270H450"/></g>
<rect x="90" y="296" width="720" height="80" rx="10" fill="#e5f1ed" stroke="#438a7a"/><text x="450" y="325" font-size="18" font-weight="bold">Expose the evidence for each model</text><text x="450" y="352" font-size="16">ipTM · structural energy · geometry · topology (receptor task)</text>
<path d="M450 376V407" fill="none" stroke="#536373" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="412" width="720" height="133" rx="10" fill="#fff" stroke="#53799a"/><text x="450" y="440" font-size="18" font-weight="bold">Apply cohort and availability checks</text><text x="450" y="467" font-size="16">No TCR:peptide contacts → retain row + discard reason, no score</text><text x="450" y="492" font-size="16">Fewer than 30 models with an interface → components only</text><text x="450" y="519" font-size="16">Otherwise → frozen task-matched score; flags report by default</text>
</g></svg>